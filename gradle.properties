# ─── FieldTrack — Gradle Properties ──────────────────────────────────────────
# This file configures Gradle behaviour for the entire project.
# ─────────────────────────────────────────────────────────────────────────────

# AndroidX: required for all modern Jetpack / Compose libraries
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Enable Compose compiler metrics (optional — remove in CI if not needed)
# kotlin.compose.compiler.metrics.enabled=true

# Memory: Gradle daemon heap size
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Parallel builds: speed up multi-module projects
org.gradle.parallel=true

# Configuration cache: speeds up repeated builds
org.gradle.configureondemand=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
